# Minimal single-binary Tempo — local disk, no object storage, no
# clustering. A laptop demo doesn't need more than this holds.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Explicit 0.0.0.0: Tempo's own default binds these to localhost,
        # unreachable from the otel-collector container on the same network.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
