x-front-of-house-image: &front-of-house-image
  build:
    context: .
    dockerfile: services/front_of_house/Dockerfile

x-front-of-house-env: &front-of-house-env
  POSTGRES_HOST: front-of-house-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: front_of_house
  POSTGRES_USER: front_of_house
  POSTGRES_PASSWORD: front_of_house
  REDIS_URL: redis://redis:6379/0
  KITCHEN_BASE_URL: http://kitchen:8001
  DISPATCH_BASE_URL: http://dispatch:8002
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "*"
  CONFIG_PATH: /app/config.yaml
  JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem

x-front-of-house-volumes: &front-of-house-volumes
  - ./config.yaml:/app/config.yaml:ro
  - front-of-house-keys:/app/keys

x-front-of-house-depends-on: &front-of-house-depends-on
  front-of-house-db:
    condition: service_healthy
  redis:
    condition: service_healthy

x-kitchen-image: &kitchen-image
  build:
    context: .
    dockerfile: services/kitchen/Dockerfile

x-kitchen-env: &kitchen-env
  KITCHEN_POSTGRES_HOST: kitchen-db
  KITCHEN_POSTGRES_PORT: "5432"
  KITCHEN_POSTGRES_DB: kitchen
  KITCHEN_POSTGRES_USER: kitchen
  KITCHEN_POSTGRES_PASSWORD: kitchen
  REDIS_URL: redis://redis:6379/0
  CONFIG_PATH: /app/config.yaml
  FRONT_OF_HOUSE_URL: http://front-of-house:8000

x-kitchen-volumes: &kitchen-volumes
  - ./config.yaml:/app/config.yaml:ro

x-kitchen-depends-on: &kitchen-depends-on
  kitchen-db:
    condition: service_healthy
  redis:
    condition: service_healthy

# The event spine's own processes (DECISIONS.md §0003/§0004) are separate
# containers, not threads inside `front_of_house`/`kitchen`, so any one of them can
# be killed on its own for the Phase 10 recovery demo. They share their
# service's image — same code, different `command:` — and use a
# liveness-only healthcheck (no HTTP endpoint to poll): good enough to keep
# `make up`'s "every container healthy" promise without pretending to
# measure queue health, which is what `stream_pending` (Phase 9) is for.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "exit(0)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

x-dispatch-image: &dispatch-image
  build:
    context: .
    dockerfile: services/dispatch/Dockerfile

x-dispatch-env: &dispatch-env
  DISPATCH_POSTGRES_HOST: dispatch-db
  DISPATCH_POSTGRES_PORT: "5432"
  DISPATCH_POSTGRES_DB: dispatch
  DISPATCH_POSTGRES_USER: dispatch
  DISPATCH_POSTGRES_PASSWORD: dispatch
  REDIS_URL: redis://redis:6379/0
  CONFIG_PATH: /app/config.yaml
  FRONT_OF_HOUSE_URL: http://front-of-house:8000

x-dispatch-volumes: &dispatch-volumes
  - ./config.yaml:/app/config.yaml:ro

x-dispatch-depends-on: &dispatch-depends-on
  dispatch-db:
    condition: service_healthy
  redis:
    condition: service_healthy

x-simulator-image: &simulator-image
  build:
    context: .
    dockerfile: services/simulator/Dockerfile

x-k6-image: &k6-image
  image: grafana/k6:2.1.0

services:
  front-of-house-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: front_of_house
      POSTGRES_USER: front_of_house
      POSTGRES_PASSWORD: front_of_house
    volumes:
      - front-of-house-db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U front_of_house -d front_of_house"]
      interval: 2s
      timeout: 3s
      retries: 30

  kitchen-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
    volumes:
      - kitchen-db-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 2s
      timeout: 3s
      retries: 30

  dispatch-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    volumes:
      - dispatch-db-data:/var/lib/postgresql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  front-of-house:
    <<: *front-of-house-image
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    ports:
      - "8000:8000"
    depends_on: *front-of-house-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  celery-worker:
    <<: *front-of-house-image
    # `-B`: embedded beat, so the one 5-second `push_board_metrics` tick
    # (Phase 9) doesn't need its own container.
    command: ["celery", "-A", "front_of_house", "worker", "--loglevel=info", "-B"]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  outbox-relay:
    <<: *front-of-house-image
    command: ["python", "manage.py", "relay"]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    # Restarts in a crash loop until `make up`'s `migrate` step creates the
    # `outbox` table — self-correcting, same as the relay's own poll fallback.
    restart: unless-stopped

  consumer-analytics:
    <<: *front-of-house-image
    command: ["python", "manage.py", "stream_consumer", "--group", "cg:analytics"]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  consumer-ws-fanout:
    <<: *front-of-house-image
    command: ["python", "manage.py", "stream_consumer", "--group", "cg:ws-fanout"]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  consumer-order-sync:
    <<: *front-of-house-image
    command:
      ["python", "manage.py", "stream_consumer", "--group", "cg:order-sync", "--stream", "events:order"]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # Dispatch's own aggregate stream (ADR 0007 §4) — `courier.assigned` lives
  # here, not on `events:order`. Same consumer group as above, a second
  # process because a Redis consumer group is scoped to one stream.
  consumer-order-sync-courier:
    <<: *front-of-house-image
    command:
      [
        "python",
        "manage.py",
        "stream_consumer",
        "--group",
        "cg:order-sync",
        "--stream",
        "events:courier",
      ]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # The board's fanout (Phase 8) merges all three fixed streams into one
  # Channels group ("board") — same "one process per stream, same group
  # name" split as `consumer-order-sync`/`-courier` above, times three.
  consumer-ws-board-fanout-order:
    <<: *front-of-house-image
    command:
      [
        "python",
        "manage.py",
        "stream_consumer",
        "--group",
        "cg:ws-board-fanout",
        "--stream",
        "events:order",
      ]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  consumer-ws-board-fanout-oven:
    <<: *front-of-house-image
    command:
      [
        "python",
        "manage.py",
        "stream_consumer",
        "--group",
        "cg:ws-board-fanout",
        "--stream",
        "events:oven",
      ]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  consumer-ws-board-fanout-courier:
    <<: *front-of-house-image
    command:
      [
        "python",
        "manage.py",
        "stream_consumer",
        "--group",
        "cg:ws-board-fanout",
        "--stream",
        "events:courier",
      ]
    environment: *front-of-house-env
    volumes: *front-of-house-volumes
    depends_on: *front-of-house-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  kitchen:
    <<: *kitchen-image
    environment: *kitchen-env
    volumes: *kitchen-volumes
    ports:
      - "8001:8001"
    depends_on: *kitchen-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  kitchen-celery-worker:
    <<: *kitchen-image
    command: ["celery", "-A", "kitchen.celery_app", "worker", "--loglevel=info"]
    environment: *kitchen-env
    volumes: *kitchen-volumes
    depends_on: *kitchen-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  kitchen-outbox-relay:
    <<: *kitchen-image
    command: ["python", "-m", "kitchen.cli", "relay"]
    environment: *kitchen-env
    volumes: *kitchen-volumes
    depends_on: *kitchen-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  kitchen-consumer:
    <<: *kitchen-image
    command: ["python", "-m", "kitchen.cli", "stream_consumer", "--group", "cg:kitchen"]
    environment: *kitchen-env
    volumes: *kitchen-volumes
    depends_on: *kitchen-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  kitchen-reaper:
    <<: *kitchen-image
    command: ["python", "-m", "kitchen.cli", "reap"]
    environment: *kitchen-env
    volumes: *kitchen-volumes
    depends_on: *kitchen-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  dispatch:
    <<: *dispatch-image
    environment: *dispatch-env
    volumes: *dispatch-volumes
    ports:
      - "8002:8002"
    depends_on: *dispatch-depends-on
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  dispatch-celery-worker:
    <<: *dispatch-image
    command: ["celery", "-A", "dispatch.celery_app", "worker", "--loglevel=info"]
    environment: *dispatch-env
    volumes: *dispatch-volumes
    depends_on: *dispatch-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  dispatch-outbox-relay:
    <<: *dispatch-image
    command: ["python", "-m", "dispatch.cli", "relay"]
    environment: *dispatch-env
    volumes: *dispatch-volumes
    depends_on: *dispatch-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  dispatch-consumer:
    <<: *dispatch-image
    command: ["python", "-m", "dispatch.cli", "stream_consumer", "--group", "cg:dispatch"]
    environment: *dispatch-env
    volumes: *dispatch-volumes
    depends_on: *dispatch-depends-on
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # Phase 9 — every process's traces and metrics land here over OTLP and
  # fan out to Tempo (traces) and Prometheus (metrics, via one aggregated
  # `/metrics` on :8889 rather than one endpoint per container — ADR 0009).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # host-side debugging/smoke-testing convenience
    depends_on:
      tempo:
        condition: service_started

  tempo:
    # Pinned: `latest` currently resolves to Tempo v3's scheduler/worker
    # architecture, an incompatible config schema for the single-binary
    # setup this demo needs. 2.7.x is the last monolithic-mode line.
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" # host-side debugging/smoke-testing convenience
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v3.13.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  # `make load` (Phase 9) — profile-gated like `simulator`, so it never
  # starts as part of `make up`/`make demo`.
  k6:
    <<: *k6-image
    profiles: ["load"]
    volumes:
      - ./scripts/load:/scripts:ro
      - ./docs/load:/out
    depends_on:
      front-of-house:
        condition: service_healthy

  # An ordinary API client (CLAUDE.md §5) — `make sim`/`make rush` run this
  # with `docker compose run`, not `up`, so it never starts as part of
  # `make up`/`make demo`. No POSTGRES_*/REDIS_URL env vars, no ports
  # exposed, no privileged scope: enforced here, not by convention, so a
  # reviewer can confirm the isolation from this file alone.
  simulator:
    <<: *simulator-image
    profiles: ["simulator"]
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      front-of-house:
        condition: service_healthy

volumes:
  front-of-house-db-data:
  kitchen-db-data:
  dispatch-db-data:
  front-of-house-keys:
