services:
  gateway-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    volumes:
      - gateway-db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      POSTGRES_HOST: gateway-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      gateway-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  gateway-db-data:
