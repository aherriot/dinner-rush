name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.11.32"
  PNPM_VERSION: "11.17.0"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build
        run: pnpm --filter web run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bring the stack up
        run: docker compose up -d --build

      - name: Wait for every container to report healthy
        run: |
          deadline=$((SECONDS + 90))
          while true; do
            unhealthy=$(docker compose ps --format '{{.Health}}' | grep -v -c '^healthy$' || true)
            if [ "$unhealthy" -eq 0 ]; then
              echo "all containers healthy"
              docker compose ps
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "containers did not become healthy within 90s"
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
