name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.11.32"
  PNPM_VERSION: "11.17.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yaml'

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      kitchen-postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: kitchen
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      dispatch-postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: dispatch
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: gateway's checked-in OpenAPI schema is up to date
        working-directory: services/gateway
        run: |
          uv run python manage.py spectacular --format openapi-json --file openapi.json --fail-on-warn
          git diff --exit-code -- openapi.json

      - name: kitchen's checked-in OpenAPI schema is up to date
        run: |
          uv run python services/kitchen/scripts/export_openapi.py
          git diff --exit-code -- services/kitchen/openapi.json

      - name: dispatch's checked-in OpenAPI schema is up to date
        run: |
          uv run python services/dispatch/scripts/export_openapi.py
          git diff --exit-code -- services/dispatch/openapi.json

      - name: simulator's generated client is up to date
        run: |
          uv run python services/simulator/scripts/generate_client.py
          git diff --exit-code -- services/simulator/src/simulator/client/models.py

      - name: pytest
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          KITCHEN_POSTGRES_HOST: localhost
          KITCHEN_POSTGRES_PORT: "5433"
          DISPATCH_POSTGRES_HOST: localhost
          DISPATCH_POSTGRES_PORT: "5434"
        run: uv run pytest

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.frontend == 'true'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: tokens:build is up to date
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run tokens:check

      - name: generated gateway API client is up to date
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run api:check

      - name: stylelint + eslint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run lint

      - name: Typecheck + build
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter web run build

      - name: Storybook build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run build-storybook

      - name: Unit tests
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run test:unit

      - name: Install Playwright browser (for Storybook's Vitest addon)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook interaction + a11y tests
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run test:storybook

      - name: No apps/web changes — short-circuited
        if: needs.changes.outputs.frontend != 'true'
        run: echo "Skipping — this PR doesn't touch apps/web, pnpm-lock.yaml, pnpm-workspace.yaml, package.json or the CI workflow."

  visual:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.frontend == 'true'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression + axe (every Storybook story, light + dark)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: pnpm run test:visual

      - name: Upload Playwright report
        if: failure() && needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: No apps/web changes — short-circuited
        if: needs.changes.outputs.frontend != 'true'
        run: echo "Skipping — this PR doesn't touch apps/web, pnpm-lock.yaml, pnpm-workspace.yaml, package.json or the CI workflow."

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Provide config.yaml
        run: cp config.example.yaml config.yaml

      - name: Bring the stack up
        run: docker compose up -d --build

      - name: Simulator image builds (profile-gated, not part of the default stack)
        run: docker compose --profile simulator build simulator

      - name: Wait for every container to report healthy
        run: |
          deadline=$((SECONDS + 90))
          while true; do
            unhealthy=$(docker compose ps --format '{{.Health}}' | grep -v -c '^healthy$' || true)
            if [ "$unhealthy" -eq 0 ]; then
              echo "all containers healthy"
              docker compose ps
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "containers did not become healthy within 90s"
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
