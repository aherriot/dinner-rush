[project]
name = "dispatch"
version = "0.1.0"
description = "Courier assignment, GEO search and the time-boxed address grant (FastAPI + Celery + SQLAlchemy)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.38,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "celery>=5.5,<6",
    "redis>=8.0,<9",
    "pydantic>=2.13,<3",
    "dinner-rush-core",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-repeat>=0.9,<1",
    "hypothesis>=6.140,<7",
    "httpx>=0.28,<1",
    "mypy>=2.3,<3",
    "celery-types>=0.23,<1",
]

[tool.uv.sources]
dinner-rush-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
