[project]
name = "front-of-house"
version = "0.1.0"
description = "Public API, admin API and websocket fanout (Django + DRF + Channels)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.17,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<0.29",
    "django-cors-headers>=4.9,<5",
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
    "daphne>=4.2,<5",
    "celery>=5.5,<6",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=8.0,<9",
    "cryptography>=44,<45",
    "pyjwt[crypto]>=2.10,<3",
    "dinner-rush-core",
    "opentelemetry-instrumentation-django>=0.51b0,<1",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1",
    "opentelemetry-instrumentation-celery>=0.51b0,<1",
    "opentelemetry-instrumentation-asgi>=0.51b0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-django>=4.12,<5",
    "mypy>=2.3,<3",
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.16,<3.17",
    "types-channels>=4.3,<5",
    "celery-types>=0.23,<1",
]

[tool.uv.sources]
dinner-rush-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/front_of_house"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "front_of_house.settings"
python_files = ["test_*.py"]
