[project]
name = "simulator"
version = "0.1.0"
description = "Ordinary API client generating Poisson-arrival load against front-of-house's public API (CLAUDE.md §5, PHASES.md Phase 6)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic[email]>=2.13,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0,<2",
    "mypy>=2.3,<3",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
asyncio_mode = "auto"
