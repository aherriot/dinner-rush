[project]
name = "gateway"
version = "0.1.0"
description = "Public API, admin API and websocket fanout (Django + DRF + Channels)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.17,<4",
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
    "psycopg[binary]>=3.2,<4",
    "redis>=8.0,<9",
    "dinner-rush-core",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-django>=4.12,<5",
    "mypy>=2.3,<3",
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.16,<3.17",
    "types-channels>=4.3,<5",
]

[tool.uv.sources]
dinner-rush-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gateway.settings"
python_files = ["test_*.py"]
