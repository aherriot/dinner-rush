[project]
name = "dinner-rush-core"
version = "0.1.0"
description = "Shared envelope, transport, auth and config code for all Dinner Rush services"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "redis>=8.0,<9",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinner_rush_core"]
